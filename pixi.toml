[workspace]
name = "qpbenchmark"
version = "2.5.0"
description = "Benchmark for quadratic programming solvers"
authors = ["Stéphane Caron <stephane.caron@normalesup.org>"]
channels = ["conda-forge", "gurobi"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]

[tasks]
test = "python -m unittest discover -s tests -t . -v"
test-file = { cmd = "python -m unittest", description = "Run a specific test file, e.g.: pixi run test-file tests.test_run -v" }
qpbenchmark = "qpbenchmark"

[dependencies]
qpbenchmark = { path = "."}
python = ">=3.9"
matplotlib = ">=3.6.2"
numpy = ">=1.25.2"
pandas = ">=1.4.3"
psutil = ">=5.9.0"
py-cpuinfo = ">=9.0.0"
pyarrow = ">=15.0.0"
qpsolvers = ">=4.3.1"
tabulate = ">=0.9.0"
tqdm = ">=4.67.1"
clarabel = ">=0.4.1"
cvxopt = ">=1.3.0"
daqp = ">=0.5.1"
ecos = ">=2.0.10"
gurobi = ">=11.0.3"
ipython = "*"
jaxopt = "*"
kvxopt = "*"
osqp = ">=0.6.2"
piqp = ">=0.2.2"
proxsuite = ">=0.4.1"
qpoases = ">=3.2.0"
quadprog = ">=0.1.11"
scs = ">=3.2.2"
tox = "*"

[pypi-dependencies]
highspy = ">=1.5.2"
qpalm = ">=1.2.1"
qpax = "*"

[package.build.backend] 
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
python = ">=3.9"
flit-core = ">=2,<4"
matplotlib = ">=3.6.2"
numpy = ">=1.25.2"
pandas = ">=1.4.3"
